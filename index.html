<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>客户情况分析 · 华东区 DI</title>
<style>
:root{--bg:#0f1420;--fg:#e8ecf4;--muted:#93a0b8;--acc:#4f8cff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 20% 0%,#16213a 0%,var(--bg) 55%);color:var(--fg);
font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center}
.wrap{width:min(430px,92vw);padding:34px 30px 24px;border-radius:16px;background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 50px rgba(0,0,0,.45)}
h1{font-size:17px;margin:0 0 6px;font-weight:600;letter-spacing:.02em}
.sub{font-size:12.5px;color:var(--muted);line-height:1.65;margin-bottom:22px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
input{width:100%;padding:11px 13px;border-radius:9px;border:1px solid rgba(255,255,255,.16);
background:rgba(0,0,0,.35);color:var(--fg);font-size:15px;outline:none}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,140,255,.18)}
button{margin-top:14px;width:100%;padding:11px 0;border:0;border-radius:9px;background:var(--acc);color:#fff;
font-size:14.5px;font-weight:600;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.bar{height:3px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:16px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.msg{margin-top:12px;font-size:12.5px;line-height:1.6;min-height:18px;color:var(--muted)}
.msg.err{color:#ff8a8a}
.foot{margin-top:18px;font-size:11.5px;color:#6d798f;line-height:1.6}
</style></head>
<body><div class="wrap">
<h1>客户情况分析 · 华东区 DI</h1>
<div class="sub">该页面已加密。输入访问密码后在本机解密阅读；密码不上传，服务器只提供密文。</div>
<label for="pw">访问密码</label>
<input id="pw" type="password" autocomplete="off" spellcheck="false" placeholder="请输入密码">
<button id="go">解密并打开</button>
<div class="bar" id="bar"><i id="barI"></i></div>
<div class="msg" id="msg"></div>
<div class="foot">解密在本机完成（AES-256-GCM）；刷新页面需重新输入密码。</div>
</div>
<script>
var SALT_B64 = "urH0E8duBa55WRytEJ8Meg==", ITER = 250000, SRC = "report.enc?v=4687e558";
var $ = function(id){ return document.getElementById(id); };
var msg = $('msg'), btn = $('go'), bar = $('bar'), barI = $('barI');

function b64ToBytes(b64){
  var bin = atob(b64), out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function say(t, err){ msg.textContent = t; msg.className = err ? 'msg err' : 'msg'; }
function progress(p){ bar.style.display = 'block'; barI.style.width = Math.round(p * 100) + '%'; }

async function deriveKey(pw){
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: b64ToBytes(SALT_B64), iterations: ITER, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
}
async function fetchEnc(){
  var r = await fetch(SRC, { cache:'no-store' });
  if (!r.ok) throw new Error('密文下载失败 HTTP ' + r.status);
  var total = +r.headers.get('content-length') || 0, got = 0, chunks = [];
  var reader = r.body.getReader();
  while (true) {
    var step = await reader.read();
    if (step.done) break;
    chunks.push(step.value); got += step.value.length;
    if (total) progress(got / total * 0.85);
  }
  var buf = new Uint8Array(got), off = 0;
  for (var i = 0; i < chunks.length; i++) { buf.set(chunks[i], off); off += chunks[i].length; }
  return buf;
}
async function unlock(){
  var pw = $('pw').value.trim();
  if (!pw) { say('请输入密码。', true); return; }
  if (!(crypto && crypto.subtle)) { say('当前浏览器不支持本地解密，请用 Chrome / Edge / Safari 新版。', true); return; }
  btn.disabled = true;
  try {
    say('正在下载密文…');
    var raw = await fetchEnc();
    if (raw.length < 16) throw new Error('密文不完整');
    say('正在派生密钥并解密（首次约需数秒）…');
    progress(0.9);
    var key = await deriveKey(pw);
    var plain;
    try {
      plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv: raw.subarray(0, 12) }, key, raw.subarray(12));
    } catch (e) {
      progress(0); bar.style.display = 'none';
      btn.disabled = false;
      say('密码不正确，或密文已更新。请核对后重试。', true);
      return;
    }
    progress(1);
    say('解密完成，正在打开…');
    var blob = new Blob([new Uint8Array(plain)], { type:'text/html;charset=utf-8' });
    location.replace(URL.createObjectURL(blob));
  } catch (e) {
    bar.style.display = 'none';
    btn.disabled = false;
    say('打开失败：' + (e && e.message ? e.message : e), true);
  }
}
btn.addEventListener('click', unlock);
$('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') unlock(); });
</script>
</body></html>
